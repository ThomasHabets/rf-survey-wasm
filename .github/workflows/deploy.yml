name: Build and deploy WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Cargo.toml deliberately uses sibling path patches while the required
      # uhd-pure and rustradio-ui releases are under development.
      - name: Check out patched dependencies
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ThomasHabets/rustradio "$GITHUB_WORKSPACE/../rustradio"
          git clone --depth 1 https://github.com/ThomasHabets/uhd-pure "$GITHUB_WORKSPACE/../uhd-pure"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install UHD image downloader
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq uhd-host

      - name: Download B200 firmware and FPGA image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uhd-images"
          uhd_images_downloader \
            --types 'b2xx_(b200_fpga|common_fw)_default' \
            --install-location "$RUNNER_TEMP/uhd-images" \
            --yes

      - name: Build site
        env:
          UHD_IMAGES_DIR: ${{ runner.temp }}/uhd-images
        run: ./build-pages.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
